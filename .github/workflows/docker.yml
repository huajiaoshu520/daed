name: Build daed Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/daed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      # Remove this compatibility patch when wing includes the instance-stats fix.
      - name: Fix runtime overview statistics source
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path("wing/dae/runtime.go")
          source = path.read_text()
          replacements = {
              "\tactiveTCPConnections := 0": "\tsnapshot := control.RuntimeStatsSnapshot{UpdatedAt: time.Now()}",
              "\t\tactiveTCPConnections = ctl.ActiveTCPConnections()": "\t\t// Traffic is recorded on this control plane, not the legacy global store.\n\t\tsnapshot = ctl.SnapshotRuntimeStats(windowSec, maxPoints)",
              "\n\tsnapshot := control.SnapshotRuntimeStats(activeTCPConnections, control.DefaultUdpEndpointPool.Count(), windowSec, maxPoints)\n": "",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit("wing runtime statistics source changed; review the patch before building")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PYTHON

      # 从 apps/web/package.json 自动读取 version
      - name: Get daed version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/web/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "DAED_VERSION=$VERSION"
          echo "Detected daed version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            DAED_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
