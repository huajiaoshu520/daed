name: Build daed Docker

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/daed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # Checkout daed
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      # Build exactly the reviewed source, including the pinned wing/core.
      - name: Show pinned source revisions
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git submodule status --recursive
          test -f wing/component/xray/config.go

      # ============================================================
      # 从 apps/web/package.json 自动读取 daed 版本
      # ============================================================
      - name: Get daed version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./apps/web/package.json').version")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "DAED_VERSION=$VERSION"
          echo "Detected daed version: $VERSION"
          echo "======================================"

      # ============================================================
      # Docker Buildx
      # ============================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # Login GHCR
      # ============================================================
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # Docker metadata
      #
      # 自动生成：
      # ghcr.io/huajiaoshu520/daed:latest
      # ghcr.io/huajiaoshu520/daed:1.28.0
      # ============================================================
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      # ============================================================
      # Build + Push
      # ============================================================
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64

          build-args: |
            DAED_VERSION=${{ steps.version.outputs.version }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
